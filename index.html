<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이재야, 생일 축하해!</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Segoe UI", sans-serif; height: 100vh; overflow: hidden; background: #0d0520; }

    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .screen.hidden { display: none; }
    .screen.fade-in { animation: screenIn .6s ease forwards; }
    @keyframes screenIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }

    /* ── Screen 1 ── */
    #s1 { background: radial-gradient(ellipse at 50% 40%, #2a0e61 0%, #0d0520 70%); }
    .stars-layer { position: absolute; inset: 0; pointer-events: none; }
    .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle var(--d,2s) var(--dl,0s) infinite; }
    @keyframes twinkle { 0%,100%{opacity:0;transform:scale(.2);} 50%{opacity:1;transform:scale(1);} }
    .s1-content { text-align: center; z-index: 1; }
    .big-title { font-size: clamp(2.2rem,7vw,4.5rem); color:#fff; line-height:1.2; animation:fadeUp .9s ease forwards; text-shadow:0 0 40px rgba(200,130,255,.8),0 0 80px rgba(200,130,255,.4); }
    .sub-title { margin-top:.8rem; font-size:clamp(1rem,3vw,1.6rem); color:#ffd700; opacity:0; animation:fadeUp .9s ease .5s forwards; }
    .go-btn { margin-top:2.8rem; padding:.9rem 2.8rem; font-size:1.1rem; background:linear-gradient(135deg,#b44fff,#ff6bbd); color:#fff; border:none; border-radius:50px; cursor:pointer; opacity:0; animation:fadeUp .9s ease 1s forwards; transition:transform .2s,box-shadow .2s; box-shadow:0 4px 20px rgba(180,80,255,.5); }
    .go-btn:hover { transform:scale(1.07); box-shadow:0 8px 30px rgba(180,80,255,.7); }
    @keyframes fadeUp { from{opacity:0;transform:translateY(28px);} to{opacity:1;transform:translateY(0);} }

    /* ── Screen 2 ── */
    #s2 { background: radial-gradient(ellipse at 50% 60%, #0e2450 0%, #0d0520 70%); overflow: hidden; }

    /* Candle zone */
    .candle-zone {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      min-height: 110px;
      width: 280px;
      z-index: 10;
      position: relative;
      padding-bottom: 0;
    }

    /* ── Candle ── */
    .candle { display:flex; flex-direction:column; align-items:center; }

    .flame-wrap {
      position: relative;
      width: 24px;
      height: 40px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .flame-outer {
      position: absolute;
      bottom: 0;
      width: 22px;
      height: 34px;
      background: radial-gradient(ellipse at 50% 85%, #fff 0%, #fff176 20%, #ff9800 55%, #e64a19 90%, transparent 100%);
      border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
      animation: flicker .35s infinite alternate ease-in-out;
      transform-origin: bottom center;
      filter: drop-shadow(0 0 8px #ffa726) drop-shadow(0 0 18px #ff6d00);
    }
    .flame-inner {
      position: absolute;
      bottom: 4px;
      width: 10px;
      height: 18px;
      background: radial-gradient(ellipse at 50% 80%, #fff 0%, #fff9c4 50%, transparent 100%);
      border-radius: 50% 50% 30% 30% / 60% 60% 40% 40%;
      animation: flicker .35s infinite alternate-reverse ease-in-out;
      transform-origin: bottom center;
    }
    .flame-outer.extinguished, .flame-inner.extinguished { display: none; }

    .smoke-puff {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 0;
      background: rgba(210,210,210,.7);
      border-radius: 50%;
      display: none;
    }
    .smoke-puff.rising { display: block; animation: smokeUp 1.4s ease-out forwards; }

    @keyframes flicker {
      0%   { transform: scaleX(1)    rotate(-4deg) scaleY(1); }
      100% { transform: scaleX(.72)  rotate( 4deg) scaleY(1.1); }
    }
    @keyframes smokeUp {
      0%   { height:0;    opacity:.75; transform:translateX(-50%) translateY(0)    scaleX(1); }
      50%  { height:22px; opacity:.5;  transform:translateX(-50%) translateY(-18px) scaleX(1.6); }
      100% { height:32px; opacity:0;   transform:translateX(-50%) translateY(-40px) scaleX(2.8); }
    }

    .wick { width:3px; height:8px; background:#3d2b1a; margin-bottom:-1px; border-radius:2px 2px 0 0; }

    .candle-body {
      width: 22px;
      height: 75px;
      border-radius: 7px 7px 4px 4px;
      position: relative;
      overflow: hidden;
      box-shadow: inset -4px 0 6px rgba(0,0,0,.18), inset 4px 0 5px rgba(255,255,255,.25);
    }
    /* highlight stripe */
    .candle-body::after {
      content: '';
      position: absolute;
      top: 8%;
      left: 25%;
      width: 28%;
      height: 65%;
      background: rgba(255,255,255,.28);
      border-radius: 50%;
      filter: blur(2px);
    }

    /* colour per position (cycles every 5) */
    .candle:nth-child(5n+1) .candle-body { background: linear-gradient(160deg, #ff8ab3 0%, #f94f8a 60%, #d63674 100%); }
    .candle:nth-child(5n+2) .candle-body { background: linear-gradient(160deg, #80d4ff 0%, #2ea8f5 60%, #1578c8 100%); }
    .candle:nth-child(5n+3) .candle-body { background: linear-gradient(160deg, #ffe766 0%, #ffc400 60%, #e0a000 100%); }
    .candle:nth-child(5n+4) .candle-body { background: linear-gradient(160deg, #cc88ff 0%, #9b3dff 60%, #7020d0 100%); }
    .candle:nth-child(5n+5) .candle-body { background: linear-gradient(160deg, #78ffc5 0%, #1de99b 60%, #00b877 100%); }

    .candle-base { width:28px; height:7px; border-radius:4px; margin-top:-1px; }
    .candle:nth-child(5n+1) .candle-base { background: #d63674; }
    .candle:nth-child(5n+2) .candle-base { background: #1578c8; }
    .candle:nth-child(5n+3) .candle-base { background: #e0a000; }
    .candle:nth-child(5n+4) .candle-base { background: #7020d0; }
    .candle:nth-child(5n+5) .candle-base { background: #00b877; }

    /* ── Cake ── */
    .cake-graphic {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -6px;
      filter: drop-shadow(0 16px 32px rgba(0,0,0,.38));
    }

    /* Frosting */
    .frosting-wrap {
      position: relative;
      width: 290px;
      height: 52px;
      z-index: 3;
      overflow: visible;
    }
    .frosting-blob {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #ffffff 0%, #fff0f8 100%);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      box-shadow: 0 -4px 14px rgba(255,140,190,.25), inset 0 -6px 10px rgba(255,180,210,.12);
    }
    .drip {
      position: absolute;
      bottom: 0;
      background: linear-gradient(180deg, #fff0f8 0%, #ffadd1 55%, #ff80b8 100%);
      border-radius: 0 0 60% 60%;
      transform: translateY(100%);
      box-shadow: 0 3px 6px rgba(255,100,160,.18);
    }

    /* Cake body */
    .cake-body {
      width: 290px;
      height: 120px;
      background: linear-gradient(170deg, #fef4ec 0%, #fbe6d4 35%, #f8d8be 68%, #f4caab 100%);
      position: relative;
      z-index: 2;
      overflow: hidden;
    }
    .cake-body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right,
        rgba(0,0,0,.08) 0%, transparent 14%,
        transparent 86%, rgba(0,0,0,.08) 100%);
      pointer-events: none;
    }
    /* Cream filling stripe */
    .cream-stripe {
      position: absolute;
      top: 42px; left: 0; right: 0;
      height: 20px;
      background: linear-gradient(180deg, rgba(255,255,255,.95) 0%, rgba(255,238,248,.75) 100%);
      box-shadow: 0 2px 8px rgba(255,120,170,.14), 0 -1px 6px rgba(255,120,170,.1);
    }
    .cake-deco {
      position: absolute;
      font-size: 1.5rem;
      line-height: 1;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.18));
    }

    /* Cake bottom edge */
    .cake-bottom {
      width: 290px;
      height: 18px;
      background: linear-gradient(180deg, #e8a870 0%, #c07838 100%);
      border-radius: 0 0 10px 10px;
      z-index: 2;
      position: relative;
      box-shadow: inset 0 3px 6px rgba(255,200,150,.3);
    }

    /* Plate */
    .cake-plate {
      width: 348px;
      height: 22px;
      background: linear-gradient(180deg, #f8f5f0 0%, #e0d8d0 100%);
      border-radius: 50%;
      box-shadow: 0 10px 28px rgba(0,0,0,.42), inset 0 2px 0 rgba(255,255,255,.8);
      z-index: 1;
      position: relative;
      margin-top: -5px;
    }

    /* ── Controls ── */
    .controls { margin-top:.7rem; display:flex; flex-direction:column; align-items:center; gap:.5rem; z-index:1; }
    .count-label { color:#ffd700; font-size:.95rem; min-height:1.4em; }
    .btn-row { display:flex; gap:.6rem; }
    .add-btn, .remove-btn { padding:.5rem 1.3rem; color:#fff; border-radius:50px; cursor:pointer; font-size:.9rem; backdrop-filter:blur(8px); transition:background .2s,transform .2s; }
    .add-btn { background:rgba(255,255,255,.13); border:1.5px solid rgba(255,255,255,.35); }
    .add-btn:hover { background:rgba(255,255,255,.23); transform:scale(1.05); }
    .remove-btn { background:rgba(255,80,80,.18); border:1.5px solid rgba(255,100,100,.4); }
    .remove-btn:hover { background:rgba(255,80,80,.32); transform:scale(1.05); }
    .hint { color:rgba(255,255,255,.65); font-size:.78rem; text-align:center; max-width:280px; }

    .mic-wrap { display:flex; flex-direction:column; align-items:center; gap:.5rem; margin-top:.2rem; }
    .mic-btn { width:64px; height:64px; border-radius:50%; border:none; cursor:pointer; font-size:1.7rem; background:linear-gradient(135deg,#b44fff,#ff6bbd); box-shadow:0 0 22px rgba(180,80,255,.55); transition:transform .2s,box-shadow .2s; display:flex; align-items:center; justify-content:center; }
    .mic-btn:hover { transform:scale(1.1); }
    .mic-btn.on { animation:pulse .8s infinite; background:linear-gradient(135deg,#ff3366,#ff8c00); box-shadow:0 0 30px rgba(255,50,100,.7); }
    @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }
    .meter-bar { width:190px; height:8px; background:rgba(255,255,255,.15); border-radius:4px; overflow:hidden; display:none; }
    .meter-bar.show { display:block; }
    .meter-fill { height:100%; width:0%; background:linear-gradient(90deg,#00ff99,#ffd700,#ff4444); border-radius:4px; transition:width .08s linear; }
    .mic-label { color:rgba(255,255,255,.7); font-size:.78rem; }

    /* ── Celebration ── */
    #celebration { position:fixed; inset:0; background:rgba(5,1,20,.88); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; opacity:0; pointer-events:none; transition:opacity .8s; }
    #celebration.show { opacity:1; pointer-events:all; }
    #celebration h2 { font-size:clamp(1.8rem,6vw,3.5rem); color:#ffd700; text-align:center; animation:bounce .6s infinite alternate; text-shadow:0 0 30px rgba(255,210,0,.6); }
    #celebration p { margin-top:1rem; color:#fff; font-size:1.2rem; }
    #celebration small { margin-top:1rem; color:rgba(255,255,255,.45); font-size:.8rem; }
    .restart-btn { margin-top:1.6rem; padding:.7rem 2rem; font-size:1rem; background:linear-gradient(135deg,#b44fff,#ff6bbd); color:#fff; border:none; border-radius:50px; cursor:pointer; box-shadow:0 4px 20px rgba(180,80,255,.5); transition:transform .2s,box-shadow .2s; }
    .restart-btn:hover { transform:scale(1.07); box-shadow:0 8px 30px rgba(180,80,255,.7); }
    @keyframes bounce { from{transform:scale(1);} to{transform:scale(1.05);} }

    .confetti-piece { position:fixed; top:-12px; width:10px; height:10px; z-index:1000; border-radius:var(--br,0); animation:confettiFall var(--dur,2s) linear var(--dl2,0s) forwards; }
    @keyframes confettiFall { 0%{transform:translateY(0) rotate(0deg);opacity:1;} 100%{transform:translateY(105vh) rotate(var(--rot,720deg));opacity:0;} }
  </style>
</head>
<body>

<!-- Screen 1 -->
<div class="screen" id="s1">
  <div class="stars-layer" id="stars"></div>
  <div class="s1-content">
    <div class="big-title">🎂 이재야,<br>생일 축하해! 🎉</div>
    <div class="sub-title">특별한 날을 축하해요 ✨</div>
    <button class="go-btn" onclick="goToCake()">케이크 보러 가기 →</button>
  </div>
</div>

<!-- Screen 2 -->
<div class="screen hidden" id="s2">
  <!-- Candles above cake -->
  <div class="candle-zone" id="candleZone"></div>

  <!-- CSS Cake -->
  <div class="cake-graphic">
    <div class="frosting-wrap" id="frostingWrap">
      <div class="frosting-blob"></div>
    </div>
    <div class="cake-body">
      <div class="cream-stripe"></div>
      <span class="cake-deco" style="top:12px;left:18px">🍓</span>
      <span class="cake-deco" style="top:55px;left:14px">🫐</span>
      <span class="cake-deco" style="top:12px;left:90px">🫐</span>
      <span class="cake-deco" style="top:58px;left:116px">🍓</span>
      <span class="cake-deco" style="top:12px;right:18px">🍓</span>
      <span class="cake-deco" style="top:55px;right:14px">🫐</span>
    </div>
    <div class="cake-bottom"></div>
    <div class="cake-plate"></div>
  </div>

  <div class="controls">
    <div class="count-label" id="countLabel">초를 추가해보세요!</div>
    <div class="btn-row">
      <button class="add-btn" onclick="addCandle()">🕯 초 추가</button>
      <button class="remove-btn" onclick="removeCandle()">✂️ 초 빼기</button>
    </div>
    <div class="hint">마이크 버튼을 누른 후 "후" 라고 말해보세요!</div>
    <div class="mic-wrap">
      <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
      <div class="meter-bar" id="meterBar"><div class="meter-fill" id="meterFill"></div></div>
      <div class="mic-label" id="micLabel">마이크 시작</div>
    </div>
  </div>
</div>

<!-- Celebration -->
<div id="celebration">
  <h2>🎉 생일 축하해! 🎉</h2>
  <p>촛불을 다 껐어요! 소원을 빌어봐요 ✨</p>
  <small>화면을 탭하면 닫혀요</small>
  <button class="restart-btn" onclick="restartCard()">🏠 처음으로 돌아가기</button>
</div>

<script>
// Stars
const starsEl = document.getElementById('stars');
for (let i = 0; i < 120; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = Math.random() * 3.5 + .5;
  s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${(Math.random()*3+1).toFixed(1)}s;--dl:${(Math.random()*4).toFixed(1)}s`;
  starsEl.appendChild(s);
}

function goToCake() {
  document.getElementById('s1').classList.add('hidden');
  const s2 = document.getElementById('s2');
  s2.classList.remove('hidden');
  s2.classList.add('fade-in');
  buildDrips();
}

// Frosting drips
function buildDrips() {
  const wrap = document.getElementById('frostingWrap');
  wrap.querySelectorAll('.drip').forEach(d => d.remove());
  const drips = [
    {x:6,w:13}, {x:28,w:17}, {x:52,w:11}, {x:76,w:20},
    {x:102,w:14}, {x:128,w:18}, {x:154,w:12}, {x:180,w:20},
    {x:206,w:14}, {x:232,w:17}, {x:257,w:11}
  ];
  drips.forEach(({x, w}) => {
    const d = document.createElement('div');
    d.className = 'drip';
    const h = Math.floor(Math.random() * 14 + 16);
    d.style.cssText = `left:${x}px;width:${w}px;height:${h}px;`;
    wrap.appendChild(d);
  });
}

// Candles
let candles = [];

function addCandle() {
  const zone = document.getElementById('candleZone');
  const el = document.createElement('div');
  el.className = 'candle';
  el.innerHTML = `
    <div class="flame-wrap">
      <div class="flame-outer"></div>
      <div class="flame-inner"></div>
      <div class="smoke-puff"></div>
    </div>
    <div class="wick"></div>
    <div class="candle-body"></div>
    <div class="candle-base"></div>
  `;
  zone.appendChild(el);
  candles.push({ el, lit: true });
  updateLabel();
}

function removeCandle() {
  if (candles.length === 0) return;
  const last = candles.pop();
  last.el.remove();
  updateLabel();
}

function updateLabel() {
  const lit = candles.filter(c => c.lit).length;
  const total = candles.length;
  const lbl = document.getElementById('countLabel');
  if (total === 0) lbl.textContent = '초를 추가해보세요!';
  else if (lit === 0) lbl.textContent = '모든 촛불이 꺼졌어요! 🎉';
  else lbl.textContent = `촛불 ${lit}개 남았어요`;
}

// "후" detection using Web Speech Recognition (ko-KR)
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let micActive = false, lastBlow = 0, labelTimer = null;
const BLOW_COOLDOWN_MS = 800;

// syllables that sound like "후" — broadened to catch baby pronunciation variations
const HOO_PATTERNS = ['후', '훅', '훠', '허', '호', '풍', '부', '푸'];
function isHoo(text) { return HOO_PATTERNS.some(p => text.includes(p)); }

function setLabel(txt, resetMs) {
  document.getElementById('micLabel').textContent = txt;
  clearTimeout(labelTimer);
  if (resetMs) labelTimer = setTimeout(() => {
    if (micActive) document.getElementById('micLabel').textContent = '"후" 라고 말해보세요!';
  }, resetMs);
}

function toggleMic() {
  if (!micActive) {
    if (!SpeechRecognition) {
      setLabel('Chrome 또는 Safari에서 열어주세요');
      return;
    }
    recognition = new SpeechRecognition();
    recognition.lang = 'ko-KR';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 5;

    recognition.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        for (let j = 0; j < e.results[i].length; j++) {
          const text = e.results[i][j].transcript.trim();
          // Show what was heard so we can debug
          setLabel(`들림: "${text}"`, 2000);
          const now = Date.now();
          if (isHoo(text) && now - lastBlow > BLOW_COOLDOWN_MS) {
            lastBlow = now;
            extinguishOne();
            flashMeter();
          }
        }
      }
    };

    recognition.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        setLabel('마이크 권한 필요');
        stopMic();
      }
    };

    // Safari stops recognition after each utterance — restart with small delay
    recognition.onend = () => {
      if (micActive) setTimeout(() => { try { recognition.start(); } catch(_) {} }, 150);
    };

    recognition.start();
    micActive = true;
    document.getElementById('micBtn').classList.add('on');
    document.getElementById('meterBar').classList.add('show');
    setLabel('"후" 라고 말해보세요!');
  } else {
    stopMic();
  }
}

function stopMic() {
  micActive = false;
  if (recognition) { try { recognition.stop(); } catch(_) {} recognition = null; }
  document.getElementById('micBtn').classList.remove('on');
  document.getElementById('meterBar').classList.remove('show');
  document.getElementById('meterFill').style.width = '0%';
  document.getElementById('micLabel').textContent = '마이크 시작';
}

function flashMeter() {
  const fill = document.getElementById('meterFill');
  fill.style.transition = 'none';
  fill.style.width = '100%';
  setTimeout(() => { fill.style.transition = 'width .5s'; fill.style.width = '0%'; }, 300);
}

function extinguishOne() {
  const lit = candles.filter(c => c.lit);
  if (lit.length === 0) return;
  const c = lit[Math.floor(Math.random() * lit.length)];
  c.lit = false;
  c.el.querySelector('.flame-outer').classList.add('extinguished');
  c.el.querySelector('.flame-inner').classList.add('extinguished');
  const smoke = c.el.querySelector('.smoke-puff');
  smoke.classList.add('rising');
  setTimeout(() => smoke.classList.remove('rising'), 1400);
  updateLabel();
  if (candles.length > 0 && candles.every(c => !c.lit)) setTimeout(celebrate, 600);
}

function celebrate() {
  stopMic();
  document.getElementById('celebration').classList.add('show');
  launchConfetti();
}

function launchConfetti() {
  const colors = ['#ff6b9d','#ffd700','#6bcbff','#c77dff','#6bff9d','#ff9966'];
  for (let i = 0; i < 130; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const w = Math.random() * 8 + 6;
    const h = Math.random() * 8 + 6;
    p.style.cssText = `left:${Math.random()*100}vw;width:${w}px;height:${h}px;background:${colors[i%colors.length]};--dur:${(Math.random()*2+2).toFixed(1)}s;--dl2:${(Math.random()*1.5).toFixed(2)}s;--rot:${Math.random()>.5?720:-720}deg;--br:${Math.random()>.5?'50%':'2px'};transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 4200);
  }
}

document.getElementById('celebration').addEventListener('click', (e) => {
  if (e.target.classList.contains('restart-btn')) return;
  document.getElementById('celebration').classList.remove('show');
});

function restartCard() {
  document.getElementById('celebration').classList.remove('show');
  stopMic();
  // Clear candles
  candles = [];
  document.getElementById('candleZone').innerHTML = '';
  // Clear drips
  const wrap = document.getElementById('frostingWrap');
  wrap.querySelectorAll('.drip').forEach(d => d.remove());
  updateLabel();
  // Switch screens
  const s2 = document.getElementById('s2');
  s2.classList.add('hidden');
  s2.classList.remove('fade-in');
  const s1 = document.getElementById('s1');
  s1.classList.remove('hidden');
  s1.classList.add('fade-in');
}
</script>
</body>
